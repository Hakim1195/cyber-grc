# Emplacement cible : /etc/apache2/conf-available/cyber-grc-durcissement.conf
#                     activé par « a2enconf cyber-grc-durcissement »
#
# Durcissement de PORTÉE SERVEUR. Ces directives n'ont pas leur place dans un
# VirtualHost : Apache ne les y accepte pas (ServerTokens, TraceEnable) ou les y
# applique de façon incomplète. Sans ce fichier, le vhost pose de bons en-têtes
# mais la bannière `Server:` continue d'annoncer la version d'Apache et celle
# d'OpenSSL — un renseignement offert à qui cherche une vulnérabilité connue.
#
# Grille docs/PLAN_EXECUTION.md §4 : S12 (les erreurs ne renseignent pas
# l'attaquant) et S13 (dénis de service applicatifs).

# --- Ce qu'Apache dit de lui-même -------------------------------------------
# `Prod` réduit l'en-tête à « Server: Apache ». Le vhost complète avec
# ServerSignature Off (pages d'erreur) — les deux sont nécessaires.
ServerTokens Prod
ServerSignature Off

# --- Méthode TRACE ----------------------------------------------------------
# TRACE renvoie la requête telle quelle, en-têtes compris (Cross-Site Tracing).
# Aucune application n'en a l'usage ; les scanners d'audit la relèvent toujours.
TraceEnable Off

# --- Empreintes de fichiers -------------------------------------------------
# L'ETag par défaut d'Apache expose l'inode et la taille du fichier servi.
# Sans intérêt ici : le frontend est versionné par le déploiement.
FileETag None

# --- Dénis de service : connexions lentes (S13) -----------------------------
# Slowloris : un client qui envoie sa requête octet par octet immobilise un
# processus Apache. mod_reqtimeout impose un rythme minimal.
#   header : 20 s pour la première ligne, jusqu'à 40 s si le débit tient 500 o/s
#   body   : 20 s, puis 500 o/s minimum — un envoi de pièce jointe légitime
#            sur le VPN du groupe reste très au-dessus de ce seuil
<IfModule mod_reqtimeout.c>
    RequestReadTimeout header=20-40,MinRate=500 body=20,MinRate=500
</IfModule>

# --- Dénis de service : requêtes surdimensionnées (S13) ---------------------
# Bornes globales. La taille du CORPS est réglée par vhost (LimitRequestBody),
# parce qu'elle doit rester alignée sur SERVEUR_TAILLE_MAX_CORPS.
LimitRequestLine      8190
LimitRequestFields     100
LimitRequestFieldSize 8190

# Un délai d'inactivité court libère les processus ; le maintien de connexion
# reste actif, l'application charge beaucoup de petits fichiers statiques.
Timeout 60
KeepAlive On
MaxKeepAliveRequests 200
KeepAliveTimeout 5
