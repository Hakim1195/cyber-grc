# =====================================================================================
#  cyber-grc-portail.conf — LE PORTAIL FOURNISSEUR (lot L28, action 28.4)
# -------------------------------------------------------------------------------------
#  🛑 **C'EST LE SEUL VHOST DE CE PRODUIT DESTINÉ À ÊTRE EXPOSÉ HORS VPN.**
#
#  Il est livré **désactivé**. L'activer se fait par un geste d'exploitant, en root, et
#  seulement après avoir lu ce fichier en entier :
#
#      a2ensite cyber-grc-portail && systemctl reload apache2
#
#  ⚠️ **La consigne du `docs/PLAN_PRODUIT.md` est écrite, et elle prime sur l'envie
#  d'avancer** : la porte **S15** est la plus exigeante du plan, et *en cas de doute sur
#  ce lot, on ne livre pas*. Ce vhost ne s'ouvre pas avant l'ultrareview.
#
#  ── POURQUOI UN VHOST SÉPARÉ, ET NON UN `<Location>` DANS L'AUTRE ─────────────────
#
#  1. **La borne de corps ne se pose pas dans un `<Location>`** — mesuré, deux fois, et
#     écrit dans le vhost principal : `LimitRequestBody` y est **inopérant**. Le portail
#     doit avoir sa propre borne, donc son propre vhost.
#  2. **Le limiteur de débit non plus.** Un inconnu qui essaie des liens au hasard ne
#     doit pas pouvoir le faire au rythme du réseau.
#  3. **Et surtout : ce qui est exposé doit être ÉNUMÉRABLE.** Un `<Location>` dans le
#     vhost interne laisserait croire qu'une seule ligne sépare le public du privé. Ici,
#     ce qui est publié est ce fichier, et rien d'autre.
# =====================================================================================

<IfModule mod_ssl.c>
<VirtualHost *:443>
    # ⚠️ **UN NOM À LUI.** Le portail ne répond PAS sur le nom du produit : un
    # fournisseur n'a aucune raison de connaître l'adresse interne du client, et la
    # partager ferait de chaque lien une indication de cible.
    ServerName portail.exemple.interne

    # ================= TLS =================
    # Mêmes exigences que le vhost interne — pas moins, parce que c'est public.
    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/cyber-grc-portail.crt
    SSLCertificateKeyFile /etc/ssl/private/cyber-grc-portail.key
    SSLProtocol           -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder   on
    SSLCipherSuite        ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256
    SSLCompression        off
    SSLSessionTickets     off

    # ================= Borne de corps =================
    # ⚠️ **PLUS ÉTROITE QUE CELLE DU PRODUIT** (27 Mio), et délibérément : le portail ne
    # reçoit pas de reprise de sauvegarde. Il reçoit des réponses et, au plus, une pièce
    # jointe. 12 Mio couvre un PDF de certificat ; au-delà, c'est autre chose.
    LimitRequestBody 12582912
    # Une URL de portail est courte : un lien, et c'est tout.
    LimitRequestLine 2048
    LimitRequestFields 40
    LimitRequestFieldSize 4096

    # ================= Ce qui n'est PAS servi =================
    # ⚠️ **Aucun fichier statique.** Le portail est une API : il ne publie pas la SPA,
    # pas d'assets, pas de répertoire. Ce qui n'est pas servi ne peut pas fuir.
    DocumentRoot /var/www/cyber-grc-portail-vide
    <Directory />
        Require all denied
        Options -Indexes -FollowSymLinks
        AllowOverride None
    </Directory>

    # ================= En-têtes de provenance =================
    # ⚠️ **Effacés AVANT le relais**, exactement comme au vhost interne (constat Q-39) :
    # un client qui forge « X-Forwarded-For » ferait journaliser une fausse adresse — et
    # ici le client est un inconnu sur l'Internet public.
    RequestHeader unset X-Forwarded-For
    RequestHeader unset X-Forwarded-Host
    RequestHeader unset X-Forwarded-Proto
    RequestHeader unset X-Forwarded-Server
    RequestHeader unset X-Real-IP
    RequestHeader unset X-Request-Id
    RequestHeader unset Forwarded

    # ================= Durcissement =================
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"
    Header always set Cache-Control "no-store"
    # ⚠️ **Aucun script, aucun style, aucune image** : le portail rend du JSON. Une CSP
    # qui n'autorise rien est la bonne CSP quand rien n'est à charger.
    Header always set Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
    Header always unset Server
    ServerTokens Prod
    ServerSignature Off
    TraceEnable Off

    # ================= Limiteur de débit =================
    # ⚠️ **Le portail est la seule surface où un inconnu peut essayer des liens.** Sans
    # limiteur, il le ferait au rythme du réseau. `mod_qos` n'étant pas installé par
    # défaut sur Debian, le repli est `mod_ratelimit` pour la bande passante et le
    # limiteur applicatif du produit pour le rythme — et **l'exploitant doit poser un
    # limiteur de connexions au pare-feu** :
    #
    #     nft add rule inet filter input tcp dport 443 ct state new \
    #         meter portail { ip saddr limit rate 30/minute } accept
    #
    # ⚠️ Ce commentaire est une CONSIGNE, pas une protection : il n'agit pas. La porte
    # S15 doit vérifier que la règle existe, pas qu'elle est écrite ici.
    <IfModule mod_ratelimit.c>
        <Location />
            SetOutputFilter RATE_LIMIT
            SetEnv rate-limit 512
        </Location>
    </IfModule>

    # ================= Relais =================
    ProxyPreserveHost On
    ProxyTimeout 30
    # ⚠️ **UN SEUL PRÉFIXE RELAYÉ**, et rien d'autre : tout ce qui n'est pas
    # « /portail/ » n'atteint jamais le service.
    ProxyPass        /portail/ http://127.0.0.1:3001/portail/
    ProxyPassReverse /portail/ http://127.0.0.1:3001/portail/

    <LocationMatch "^(?!/portail/)">
        Require all denied
    </LocationMatch>

    # ================= Journaux SÉPARÉS =================
    # ⚠️ Séparés à dessein : le trafic public ne se mélange pas au trafic interne, et
    # c'est ce qui rend lisible « qui a essayé quoi » le jour où l'on regarde.
    ErrorLog  ${APACHE_LOG_DIR}/cyber-grc-portail-erreurs.log
    CustomLog ${APACHE_LOG_DIR}/cyber-grc-portail-acces.log combined
    LogLevel warn
</VirtualHost>
</IfModule>
