# Emplacement cible : /etc/apache2/sites-available/cyber-grc.conf
#
# Frontal Apache2 — Cyber GRC Groupe.
# Apache est le SEUL point d'entrée : PostgreSQL et ClamAV n'écoutent que sur
# la boucle locale, et le service Node n'est joignable que par ce proxy.
#
# Modules requis :
#   a2enmod ssl proxy proxy_http headers rewrite deflate expires
#   a2ensite cyber-grc && a2dissite 000-default && systemctl reload apache2

# --- Tout le trafic en clair est redirigé. HTTPS est OBLIGATOIRE : sans lui,
#     l'API de session refuse d'émettre son cookie sécurisé. ---
<VirtualHost *:80>
    ServerName grc.exemple.interne
    RewriteEngine On
    RewriteRule ^/?(.*) https://%{SERVER_NAME}/$1 [R=308,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName grc.exemple.interne

    # ================= TLS =================
    # Certificat émis par la PKI interne du groupe (ADCS), déjà de confiance
    # sur les postes du domaine via GPO. Voir PLAN_SERVEUR §0.2.
    SSLEngine on
    SSLCertificateFile      /etc/ssl/cyber-grc/serveur.crt
    SSLCertificateKeyFile   /etc/ssl/cyber-grc/serveur.key
    SSLCertificateChainFile /etc/ssl/cyber-grc/chaine-pki-interne.crt

    SSLProtocol             -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder     off
    SSLSessionTickets       off

    # ================= En-têtes de sécurité =================
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "same-origin"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()"

    # Politique de sécurité de contenu. L'application n'appelle aucun service
    # tiers et n'embarque aucun CDN : tout est servi localement.
    # 'unsafe-inline' sur style-src reste nécessaire tant que les modules
    # génèrent des styles en ligne (dette à solder, voir PLAN_SERVEUR §1.9).
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

    # On ne renseigne pas l'attaquant sur la pile logicielle.
    ServerSignature Off
    Header always unset X-Powered-By

    # ================= Frontend statique =================
    DocumentRoot /opt/cyber-grc/frontend

    <Directory /opt/cyber-grc/frontend>
        Options -Indexes -ExecCGI -Includes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # L'application est une SPA à routage par ancre : aucune réécriture
    # d'historique n'est nécessaire, index.html suffit.
    DirectoryIndex index.html

    # ================= API =================
    ProxyPreserveHost On
    ProxyTimeout 120
    ProxyPass        /api/ http://127.0.0.1:3001/api/
    ProxyPassReverse /api/ http://127.0.0.1:3001/api/

    # Le serveur applicatif a besoin de l'adresse réelle du client pour
    # journaliser les connexions (exigence de traçabilité, PLAN_SERVEUR §1.7).
    RequestHeader set X-Forwarded-Proto "https"

    # ================= Interdictions explicites =================
    # Le magasin de pièces jointes vit hors de l'arborescence web et n'est
    # JAMAIS servi par Apache : les fichiers ne sont délivrés que par
    # l'application, après contrôle des droits (PLAN_SERVEUR §1.6).
    <DirectoryMatch "^/var/lib/cyber-grc">
        Require all denied
    </DirectoryMatch>

    # Rien de ce qui relève du dépôt ou de la configuration n'est exposé.
    <FilesMatch "(^\.|\.(env|sql|ts|json|md|log|bak|orig)$)">
        Require all denied
    </FilesMatch>
    <DirectoryMatch "/(\.git|node_modules|db|deploy|src)/">
        Require all denied
    </DirectoryMatch>

    # ================= Performance =================
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml
    </IfModule>

    # Le jeu de données d'une filiale est chargé en une fois à la connexion
    # (PLAN_SERVEUR §1.3) : la compression compte plus que le cache ici.
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType text/css                 "access plus 7 days"
        ExpiresByType application/javascript   "access plus 7 days"
        ExpiresByType image/png                "access plus 30 days"
        ExpiresDefault                         "access plus 1 hour"
    </IfModule>
    # Jamais de cache sur l'API : les données doivent être fraîches.
    <LocationMatch "^/api/">
        Header always set Cache-Control "no-store"
    </LocationMatch>

    # ================= Journaux =================
    ErrorLog  ${APACHE_LOG_DIR}/cyber-grc-erreurs.log
    CustomLog ${APACHE_LOG_DIR}/cyber-grc-acces.log combined
    LogLevel warn
</VirtualHost>
