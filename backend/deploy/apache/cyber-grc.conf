# Emplacement cible : /etc/apache2/sites-available/cyber-grc.conf
#
# Frontal Apache2 — Cyber GRC Groupe.
# Apache est le SEUL point d'entrée : PostgreSQL et ClamAV n'écoutent que sur
# la boucle locale, et le service Node n'est joignable que par ce proxy.
#
# Modules requis :
#   a2enmod ssl proxy proxy_http headers rewrite deflate expires reqtimeout
#   a2ensite cyber-grc && a2dissite 000-default && systemctl reload apache2
#
# Le durcissement de portée SERVEUR (ServerTokens, TraceEnable, délais de lecture,
# bornes de requête) vit dans `durcissement-global.conf` : Apache n'accepte pas ces
# directives dans un VirtualHost. Les deux fichiers sont indissociables.

# --- Tout le trafic en clair est redirigé. HTTPS est OBLIGATOIRE : sans lui,
#     l'API de session refuse d'émettre son cookie sécurisé. ---
<VirtualHost *:80>
    ServerName grc.exemple.interne
    RewriteEngine On
    RewriteRule ^/?(.*) https://%{SERVER_NAME}/$1 [R=308,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName grc.exemple.interne

    # ================= TLS =================
    # Certificat émis par la PKI interne du groupe (ADCS), déjà de confiance
    # sur les postes du domaine via GPO. Voir PLAN_SERVEUR §0.2.
    SSLEngine on
    SSLCertificateFile      /etc/ssl/cyber-grc/serveur.crt
    SSLCertificateKeyFile   /etc/ssl/cyber-grc/serveur.key
    SSLCertificateChainFile /etc/ssl/cyber-grc/chaine-pki-interne.crt

    SSLProtocol             -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder     off
    SSLSessionTickets       off
    # Suites limitées à l'AEAD avec confidentialité persistante : ni RSA statique
    # (pas de confidentialité persistante), ni CBC (Lucky13 et compagnie). TLS 1.3
    # n'est pas concerné, ses suites ne se configurent pas ici.
    SSLCipherSuite          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305

    # ================= En-têtes de sécurité (S10) =================
    # HSTS : `includeSubDomains` couvre les sous-domaines de ce nom d'hôte, pas les
    # domaines frères — sans risque pour le reste du SI du groupe. Pas de `preload` :
    # le service n'est pas exposé sur Internet, la liste publique n'aurait aucun sens.
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "same-origin"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    # Aucune ressource de ce site n'a vocation à être chargée par un autre site :
    # complète frame-ancestors pour les images, scripts et pièces jointes.
    Header always set Cross-Origin-Resource-Policy "same-origin"
    Header always set Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()"

    # Politique de sécurité de contenu. L'application n'appelle aucun service
    # tiers et n'embarque aucun CDN : tout est servi localement.
    # 'unsafe-inline' sur style-src reste nécessaire tant que les modules
    # génèrent des styles en ligne (dette à solder, voir PLAN_SERVEUR §1.9).
    # blob: sur img-src : les exports PNG de la matrice EBIOS et du graphe de
    # cartographie passent par un canvas, donc par une URL blob.
    # Les directives « none » sont explicites plutôt que laissées à default-src :
    # un auditeur lit la politique, il ne la déduit pas.
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-src 'none'; child-src 'none'; worker-src 'none'; media-src 'none'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

    # On ne renseigne pas l'attaquant sur la pile logicielle (S12).
    # ServerTokens Prod, indispensable ici, est dans durcissement-global.conf.
    ServerSignature Off
    Header always unset X-Powered-By

    # ================= Dénis de service (S13) =================
    #
    # ══ CE QUE CHAQUE BORNE COUVRE VRAIMENT (constat Q-44) ═══════════════
    #
    # Ce commentaire affirmait que `LimitRequestBody` protégeait les envois de
    # l'application. **C'est faux sur `/api/`, le seul chemin qui porte un
    # corps**, et c'était affirmé sans avoir été mesuré une seule fois.
    #
    # Mesuré sur Apache 2.4.58, ce vhost, une doublure qui compte les octets :
    #
    #   POST /api/reprise   28 311 552 o  -> 200, la doublure reçoit tout
    #   POST /index.html    28 311 552 o  -> 413      ← la directive est VIVANTE
    #
    # La cause est dans le journal d'Apache, pas dans le nombre : sur
    # `/index.html`, `ap_http_filter` refuse en émettant
    # « AH01588: Requested content-length of 28311552 is larger than the
    # configured limit of 27262976 ». Sur `/api/`, cette ligne n'existe pas :
    # `mod_proxy_http` prend la main et relaie le corps sans que le filtre
    # d'entrée HTTP ne l'ait compté. Le placer dans un `<Location /api/>` n'y
    # change rien — vérifié.
    #
    # `LimitRequestBody` reste posée : elle borne réellement tout ce qui n'est
    # pas mandaté (mesuré ci-dessus), et c'est déjà cela.
    LimitRequestBody 27262976

    # ── La borne du chemin mandaté : un PRÉ-FILTRE, et rien de plus ──────
    #
    # Faute de directive qui borne un corps relayé, on refuse sur la longueur
    # ANNONCÉE, avant que `mod_proxy` ne prenne la main. Mesuré :
    #
    #   28 311 552 o annoncés -> 413 en 6 ms, la doublure ne reçoit RIEN
    #    1 000 000 o annoncés -> 200, la doublure reçoit 1 000 000
    #
    # ⚠️ CE QU'IL NE COUVRE PAS, ET IL FAUT LE LIRE AVANT DE S'Y FIER : un
    # client qui envoie **sans `Content-Length`**, en `Transfer-Encoding:
    # chunked`, n'est pas borné du tout. Mesuré : 28 Mio en chunked passent
    # entiers. Ce pré-filtre arrête donc l'envoi surdimensionné ORDINAIRE — un
    # export trop gros, un client qui se trompe — et **pas** un client hostile
    # qui choisit son encodage. Ce n'est pas la barrière du contrôle S13 ; le
    # dire autrement rendrait ce commentaire aussi faux que le précédent.
    #
    # **La borne qui tient pour l'API est APPLICATIVE** : Fastify porte
    # `bodyLimit: config.serveur.tailleMaxCorpsOctets` (`src/serveur.ts`) et
    # rend 413. Elle est en aval du frontal, elle voit le corps réel quel qu'en
    # soit l'encodage, et c'est elle qui protège le service.
    #
    # ⚠️ `-gt` et non `>` : dans mod_rewrite, `>` compare des CHAÎNES. Les deux
    # se comportent identiquement sur Apache 2.4.58 (vérifié : 9 000 000 contre
    # un seuil de 27 262 976 passe avec les deux, là où une comparaison
    # lexicographique refuserait), mais `-gt` est l'opérateur ENTIER documenté :
    # il ne dépend pas d'un comportement qu'on aurait constaté sans qu'il soit
    # promis.
    #
    # ⚠️ Les GUILLEMETS ne sont pas décoratifs : sans eux, `RewriteCond %1 -gt
    # 27262976` fait lire « 27262976 » comme le champ de DRAPEAUX, et Apache
    # refuse de démarrer (« RewriteCond: bad flag delimiters »). Trois écritures
    # sont acceptées par `configtest` et se comportent identiquement — mesuré,
    # parce que « Syntax OK » ne prouve rien ici : c'est ce même vhost qui a vu
    # `RequestHeader unset X-Forwarded-*` passer `configtest` sans rien effacer.
    #
    # Le seuil doit rester égal au `LimitRequestBody` ci-dessus, et
    # `deploy/install.sh` ne le vérifie plus en comparant deux nombres — il
    # ENVOIE un corps hors borne et constate le refus (bloc « banc: corps »).
    RewriteEngine On
    RewriteCond %{HTTP:Content-Length} ^([0-9]+)$
    RewriteCond %1 "-gt 27262976"
    RewriteRule ^/api/ - [R=413,L]

    # ================= Frontend statique =================
    DocumentRoot /opt/cyber-grc/frontend

    <Directory /opt/cyber-grc/frontend>
        # -FollowSymLinks : un lien symbolique déposé dans l'arborescence web
        # servirait n'importe quel fichier du disque, à commencer par le magasin
        # de pièces jointes (PLAN_SERVEUR §1.6, contrôle n° 5). Le frontend est
        # déployé par rsync et n'en contient aucun.
        Options -Indexes -ExecCGI -Includes -FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # L'application est une SPA à routage par ancre : aucune réécriture
    # d'historique n'est nécessaire, index.html suffit.
    DirectoryIndex index.html

    # ================= API =================
    ProxyPreserveHost On
    # ---------------------------------------------------------------------
    # ProxyTimeout — DEUXIÈME MAILLON D'UNE CHAÎNE DE TROIS. Lire avant de le
    # changer : le modifier seul rouvre le constat Q-19 de la porte S2.
    #
    # Trois fichiers portent ce délai, et ils décrivent le même trajet :
    #
    #   1. cyber-gouvernance_V4/js/core/api.js  DELAI_CHARGEMENT_MS = 60000
    #      le navigateur abandonne (AbortController) ;
    #   2. CE FICHIER — ProxyTimeout 60
    #      Apache abandonne le service applicatif et coupe la connexion arrière ;
    #   3. backend/src/entites/index.ts  BORNES.lignesParReprise = 8000
    #      le VOLUME que le serveur promet de tenir dans ces 60 s, mesuré.
    #      Son commentaire est l'endroit où la chaîne s'explique en entier :
    #      c'est là qu'il faut aller, et non ici, avant de toucher un nombre.
    #
    # ── Ce que ce commentaire disait, et qui était FAUX ──────────────────
    #
    # Il affirmait qu'« au-delà, la requête est perdue de toute façon ». Elle ne
    # l'était pas. Node ne sait pas interrompre un gestionnaire en vol : quand
    # Apache abandonnait, POST /api/reprise continuait et VALIDAIT sa
    # transaction. Mesuré : client coupé à 4 s, 11 988 enregistrements en base
    # ~35 s plus tard. L'utilisateur lisait « Le serveur n'a pas répondu dans le
    # délai imparti », puis voyait ses données apparaître au sondage suivant.
    # Ce commentaire a servi de justification au réglage pendant tout un lot.
    #
    # Ce qui est vrai depuis le correctif : en coupant la connexion arrière,
    # Apache fait annuler la transaction par le serveur (src/api/index.ts,
    # `surveillerAbandon`). Le délai n'est donc plus une coupure ambiguë — mais
    # c'est la BORNE (3) qui fait que le cas reste rare, pas ce nombre-ci.
    #
    # ── Et BASE_DELAI_REQUETE dans tout ça ───────────────────────────────
    #
    # 15 s est le délai d'UNE requête SQL (statement_timeout), pas d'un appel
    # HTTP : une reprise en enchaîne des milliers. Les deux ne se comparent pas,
    # et les aligner n'aurait aucun sens. C'est l'autre moitié de l'erreur que
    # ce commentaire portait.
    #
    # Baisser ProxyTimeout coupe des reprises que le serveur sait tenir ; le
    # monter au-delà de 60 s immobilise une connexion Apache et une connexion
    # PostgreSQL sur dix d'autant plus longtemps, sans rien réparer. Si le
    # besoin est de reprendre PLUS de 8 000 enregistrements, la réponse est de
    # scinder le fichier ou d'attendre le lot L7 (reprise fractionnée), pas
    # d'allonger ce délai.
    # ---------------------------------------------------------------------
    ProxyTimeout 60
    ProxyPass        /api/ http://127.0.0.1:3001/api/
    ProxyPassReverse /api/ http://127.0.0.1:3001/api/

    # Le serveur applicatif a besoin de l'adresse réelle du client pour
    # journaliser les connexions (exigence de traçabilité, PLAN_SERVEUR §1.7).
    #
    # ATTENTION — l'ordre compte. mod_proxy AJOUTE l'adresse du pair à la fin de
    # X-Forwarded-For, en conservant ce que le client a envoyé. Un client qui
    # forge « X-Forwarded-For: 10.0.0.1 » ferait donc journaliser une fausse
    # adresse. On efface d'abord les en-têtes de provenance, mod_proxy repose
    # ensuite les siens : ce que le service reçoit ne vient que d'Apache.
    RequestHeader unset X-Forwarded-For
    RequestHeader unset X-Forwarded-Host
    RequestHeader unset X-Forwarded-Server
    RequestHeader unset X-Real-IP
    RequestHeader unset Forwarded
    # X-Request-Id — constat Q-39, et c'est le MÊME raisonnement que les cinq
    # ci-dessus : un client qui forge cet en-tête choisissait la « référence »
    # que l'API lui rend sur une erreur ET la clé sous laquelle un exploitant
    # retrouve ses six lignes de journal. Il pouvait la répéter, la faire
    # entrer en collision, ou noyer une trace sous mille requêtes homonymes.
    #
    # ⚠️ DÉFENSE EN PROFONDEUR, ET PAS AUTRE CHOSE : `src/serveur.ts` n'en
    # dépend plus (`requestIdHeader: false`, la référence est engendrée par le
    # serveur, préfixe « REQ- »). Cette ligne ne répare rien — elle évite que
    # le service voie passer un en-tête que PERSONNE ne produit : ni le
    # frontend, ni ce vhost, ni le banc d'essai. Le frontal seul n'aurait pas
    # suffi — il ne protège ni la recette, ni un service interrogé sans passer
    # par Apache —, et c'est pour cela que les deux couches existent.
    #
    # Conséquence assumée : derrière Apache, le crochet `onRequest` qui
    # journalise la valeur du client sous « referenceClient » ne se déclenchera
    # plus. C'est voulu. Le jour où une chaîne de corrélation existera vraiment,
    # il faudra retirer cette ligne EN MÊME TEMPS qu'on ajoutera son producteur.
    RequestHeader unset X-Request-Id
    RequestHeader set X-Forwarded-Proto "https"

    # ══ POURQUOI CETTE LISTE EST ÉCRITE À LA MAIN, ET CE QUI LA TIENT ═════
    #
    # Elle est fragile par nature : `X-Request-Id` y manquait, et le sixième
    # oubli suivra. La question a donc été posée — peut-on faire moins
    # fragile ? — et la réponse est mesurée, pas supposée.
    #
    # **Non, `mod_headers` n'a pas de motif**, et le croire est pire que la
    # liste. `RequestHeader unset` prend un nom LITTÉRAL. Un motif est
    # néanmoins accepté par `apachectl configtest` — « Syntax OK » — et
    # n'efface rien. Mesuré, les cinq lignes remplacées par
    # « unset X-Forwarded-* » et « unset X-* » :
    #
    #   configtest : Syntax OK
    #   ce qui arrive au service : x-forwarded-for: 10.0.0.1, 127.0.0.1
    #                              x-forwarded-host: pirate.invalide, …
    #                              x-real-ip: 10.0.0.2   ·  forwarded: for=10.0.0.3
    #
    # L'adresse forgée traverse. Un motif donnerait donc l'apparence de la
    # généralité et la réalité du vide — exactement le garde-fou incapable
    # d'échouer que le §17.5 interdit.
    #
    # Ce qui tient la liste, faute de pouvoir la supprimer, est un CONTRÔLE :
    # `deploy/install.sh` (bloc « banc: entetes ») refuse l'installation si un
    # en-tête de requête que `backend/src/` lit ou auquel il fait confiance
    # n'est pas neutralisé ici. Les deux termes sortent de deux fichiers
    # versionnés, aucun n'est recopié dans un troisième. C'est la condition que
    # le `CONVENTIONS.md` §24 pose à une liste écrite à la main : qu'elle
    # oblige quelqu'un à trancher, et qu'un contrôle la confronte au réel.
    #
    # Ce que ce contrôle ne couvre PAS, et il faut le dire : un en-tête que
    # personne ne lit aujourd'hui traverse toujours (`X-Correlation-Id`, par
    # exemple, mesuré). C'est sans conséquence tant que rien ne le lit — et le
    # jour où quelque chose le lira, le contrôle l'exigera ici.

    # ================= Interdictions explicites =================
    # Le magasin de pièces jointes vit hors de l'arborescence web et n'est
    # JAMAIS servi par Apache : les fichiers ne sont délivrés que par
    # l'application, après contrôle des droits (PLAN_SERVEUR §1.6, contrôle n° 5).
    # Avec -FollowSymLinks ci-dessus, ce bloc est une seconde barrière : il
    # couvre un Alias ou un DocumentRoot mal repris lors d'une évolution.
    <DirectoryMatch "^/var/lib/cyber-grc">
        Require all denied
    </DirectoryMatch>
    <DirectoryMatch "^/etc/cyber-grc">
        Require all denied
    </DirectoryMatch>

    # ══ LISTE BLANCHE — SECONDE BARRIÈRE DU CONSTAT Q-31 ═════════════════
    #
    # Ce vhost a servi, sur une installation réelle, quatre classeurs de données
    # RÉELLES d'un client : registre de risques, plan de continuité, exigences
    # avec statuts de conformité, et un fichier de verrou Excel portant le nom
    # d'une personne. Ils étaient dans `cyber-gouvernance_V4/data/`, que
    # `install.sh` recopiait sans exclusion, et `DocumentRoot` + `Require all
    # granted` les délivraient à quiconque atteignait le vhost — sans aucune
    # authentification, y compris après le lot L3, puisque la SPA est statique
    # et que l'écran de connexion vivra DANS la page, pas devant elle.
    #
    # Les deux blocs ci-dessous existaient déjà. Ils n'ont pas suffi, et il faut
    # dire pourquoi : c'étaient des listes de ce qui est INTERDIT. Ni `.xlsx` ni
    # `data/` n'y figuraient, et il ne s'agit pas d'un oubli qu'on répare en
    # ajoutant deux entrées — une liste noire se contourne en changeant
    # d'extension, et la prochaine personne qui dépose un `.csv` ou un `.pdf`
    # ne relira pas cette ligne.
    #
    # D'où l'inversion : on énumère ce qui est SERVABLE, et on refuse le reste.
    # La liste est celle que la politique de sécurité de contenu ci-dessus
    # autorise déjà la page à charger depuis 'self' — script-src (js),
    # style-src (css), img-src (svg png ico jpg jpeg gif webp), font-src (woff
    # woff2), manifest-src (webmanifest), plus le document (html). Un fichier
    # d'un autre type ne peut être chargé par AUCUNE directive de cette
    # politique : il n'a donc rien à faire ici, quel qu'ait été le motif de sa
    # présence. `media-src` et `object-src` valent 'none' — ni audio, ni vidéo,
    # ni PDF embarqué : la liste ne les porte pas, et ce n'est pas un oubli.
    #
    # ⚠️ CETTE LISTE EST JUMELLE de `FRONTEND_PUBLIABLE` dans `deploy/install.sh`,
    # qui exclut les mêmes types à la COPIE. Les deux vont par paire, et
    # `install.sh` REFUSE DE CONTINUER si elles divergent : il lit la liste dans
    # le motif ci-dessous — dans ce qui refuse réellement, pas dans un
    # commentaire qui pourrait cesser d'être vrai sans que rien ne bouge — et la
    # compare à la sienne. Modifier l'une sans l'autre arrête l'installation.
    #
    # ⚠️ `(?i)` : la comparaison est insensible à la casse, comme l'est le
    # contrôle d'`install.sh` (`${ext,,}`). Sans cela, `LOGO.PNG` serait copié
    # puis refusé — une panne que personne ne saurait lire.
    #
    # ⚠️ `(?!$)` N'EST PAS UN ORNEMENT — c'est le constat Q-36, et il a rendu
    # l'application INJOIGNABLE à son URL d'entrée pendant un passage de porte.
    #
    # Une requête de répertoire — `https://hôte/`, c'est-à-dire l'URL par
    # laquelle tout le monde entre — est résolue par Apache vers le CHEMIN
    # `/opt/cyber-grc/frontend/`, dont le dernier composant est **vide**.
    # `<FilesMatch>` évalue le motif sur ce composant vide, et un motif à
    # négation est VRAI sur la chaîne vide : `Require all denied` s'appliquait
    # donc au répertoire lui-même, **avant** que `DirectoryIndex` n'ait résolu
    # `index.html`. Apache le disait dans son journal, en toutes lettres :
    #
    #   AH01630: client denied by server configuration: /opt/cyber-grc/frontend/
    #
    # Mesuré sur un Apache réel : `http://hôte` → 308 → `https://hôte/` → **403**,
    # pendant que `/index.html` rendait 200. Aucun fichier n'échappe pour autant
    # au refus : un FICHIER a toujours un nom non vide, et seule une requête de
    # RÉPERTOIRE produit le composant vide que `(?!$)` laisse passer. Ce qui est
    # exempté ici n'est donc pas un fichier, c'est le droit d'atteindre
    # `DirectoryIndex` — qui redemandera `index.html`, lequel repasse par ce
    # motif comme n'importe quel autre nom.
    #
    # ⚠️ Et l'on ne vérifie PAS ce bloc avec `/index.html` : c'est précisément
    # l'URL qui répondait 200 pendant que le produit était mort. On le vérifie
    # depuis l'URL d'entrée, redirection comprise — voir `deploy/install.sh`,
    # bloc « banc: configtest », qui prescrit les deux et dit pourquoi.
    #
    # ⚠️ CE QUE `(?!$)` NE COUVRE PAS — constat Q-50, et le dire coûte trois
    # lignes que le passage précédent n'avait pas écrites. L'exemption ne vaut
    # que pour la forme AVEC barre finale, seule à produire un composant vide.
    # Sans barre finale, le dernier composant est le NOM du répertoire, qui ne
    # porte aucune extension publiable : il est donc refusé. Mesuré :
    #
    #   GET /            -> 200   (composant vide, exempté, DirectoryIndex atteint)
    #   GET /assets      -> 403   (Apache aurait normalement redirigé 301 vers /assets/)
    #   GET /assets/     -> 403   (correct : pas d'index, Options -Indexes)
    #
    # Sans effet sur l'application livrée — aucune de ses URL n'est un
    # répertoire, et les 64 fichiers publiés sont tous servis —, et plutôt
    # favorable : cela retire un moyen de deviner l'arborescence. Mais c'est une
    # propriété du motif, pas un hasard, et ce vhost a déjà payé deux fois qu'un
    # motif fasse autre chose que ce que son commentaire annonce (Q-36, puis le
    # `RequestHeader unset X-Forwarded-*` accepté qui n'effaçait rien).
    <FilesMatch "(?i)^(?!$)(?!.*\.(html|js|css|svg|png|ico|jpg|jpeg|gif|webp|woff|woff2|webmanifest)$)">
        Require all denied
    </FilesMatch>

    # Les deux blocs historiques restent, en troisième rideau. Ils sont
    # redondants avec la liste blanche ci-dessus — tout ce qu'ils refusent,
    # elle le refuse déjà — et c'est délibéré : si l'inversion devait un jour
    # être retirée parce qu'elle gêne, ce qui protégeait avant protège encore.
    <FilesMatch "(^\.|\.(env|sql|ts|json|md|log|bak|orig|sh|service|conf)$)">
        Require all denied
    </FilesMatch>
    <DirectoryMatch "/(\.git|node_modules|db|deploy|src|test)/">
        Require all denied
    </DirectoryMatch>

    # ================= Performance =================
    # BREACH : la compression d'une réponse qui contient un secret réfléchi permet
    # d'en deviner la valeur à la taille. Ici le jeton de session vit dans un cookie
    # HttpOnly, jamais dans le corps, et l'API ne réfléchit aucune entrée. Si un
    # jeton anti-CSRF venait à être placé dans une réponse JSON (lot L3), il faudra
    # retirer application/json de cette liste.
    # ══ LES TYPES SE LISENT DANS CE QU'APACHE ÉMET, JAMAIS DE MÉMOIRE ════
    #
    # Constat Q-42. Cette ligne nommait `application/javascript` — et Apache
    # 2.4.58 sert les `.js` en **`text/javascript`**. Le filtre ne s'appliquait
    # donc à AUCUN des 59 fichiers JavaScript du produit : **2 166 105 octets,
    # 2,07 Mio, transférés non compressés** à chaque poste, sur vingt filiales
    # dont certaines à l'étranger. Pour l'échelle, mesuré sur ce même Apache :
    # `style.css` passe de 53 263 à 10 657 octets par ce filtre.
    #
    # Le défaut n'est pas une faute de frappe, c'est une méthode : le type a été
    # écrit de mémoire au lieu d'être lu dans la réponse. Voici donc ce
    # qu'Apache 2.4.58 émet RÉELLEMENT pour chaque type que la liste blanche
    # publie — mesuré, un fichier témoin par extension :
    #
    #   .html → text/html                  .woff  → font/woff
    #   .js   → text/javascript  (⚠ Q-42)  .woff2 → font/woff2
    #   .css  → text/css                   .ico   → image/vnd.microsoft.icon (⚠ pas image/x-icon)
    #   .svg  → image/svg+xml              .jpg .jpeg → image/jpeg
    #   .png  → image/png                  .gif   → image/gif · .webp → image/webp
    #   .webmanifest → application/manifest+json
    #
    # ⚠️ Avant d'ajouter un type ici, servir un fichier de ce type et LIRE
    # l'en-tête. La commande est dans `deploy/install.sh`, bloc « banc: configtest ».
    #
    # `application/javascript` est CONSERVÉ à côté de `text/javascript`, et ce
    # n'est pas du bruit : les deux orthographes existent selon la version
    # d'Apache et le `mime.types` de la distribution. Nommer les deux coûte zéro
    # et protège d'une bascule silencieuse dans l'autre sens.
    #
    # `text/plain` et `application/json` ne sont émis par AUCUN fichier de la
    # racine web (`.txt` et `.json` ne sont pas publiables : ils rendent 403).
    # Ils sont là pour les réponses de l'API, relayées par le proxy et
    # compressées par le même filtre — ce banc ne peut pas les exercer, et c'est
    # dit plutôt que supposé.
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/css text/plain \
                                      text/javascript application/javascript \
                                      application/json image/svg+xml
    </IfModule>

    # ---- Cache des fichiers statiques : long, ET SEULEMENT PARCE QU'ILS SONT VERSIONNÉS
    #
    # ⚠️ CE BLOC N'EST SÛR QUE COUPLÉ AU JETON DE VERSION posé par
    #    `deploy/install.sh` (fonctions `jeton_frontend` / `injecter_jeton_frontend`).
    #
    # Sans ce jeton, ces sept jours signifient : aucun correctif du frontend n'atteint
    # un poste avant une semaine. Sur vingt filiales derrière un VPN, cela veut dire
    # une semaine de données fausses pendant que l'exploitant constate que « le
    # correctif ne marche pas ». Le défaut a été relevé à trois passages de la porte
    # S2 avant d'être fermé.
    #
    # Avec le jeton, chaque URL devient « js/app.js?v=1.4.2.4687f6ba1579 » : une
    # livraison qui change un seul octet change l'URL, le navigateur retélécharge, et
    # le cache long redevient un atout — le chargement initial est un point de
    # conception du PLAN_SERVEUR §1.3, et 61 requêtes conditionnelles à chaque ouverture
    # sur un VPN international ne sont pas gratuites.
    #
    # Si l'injection venait à être retirée d'install.sh, il faudrait retirer d'ici
    # text/css et application/javascript DANS LE MÊME CHANGEMENT.
    # ⚠️ MÊME DÉFAUT QU'AU BLOC DE COMPRESSION, MÊME CONSTAT Q-42 : cette liste
    # nommait `application/javascript`, qu'Apache n'émet pas. Les 59 fichiers
    # JavaScript étaient donc **revalidés toutes les heures** (`ExpiresDefault`)
    # au lieu de sept jours — exactement les « 61 requêtes conditionnelles à
    # chaque ouverture sur un VPN international » que le commentaire ci-dessus
    # se félicitait d'éviter. Le coût décrit était payé, chaque heure.
    #
    # ⚠️ Les sept jours ne valent QUE pour `text/css` et `text/javascript`,
    # parce que `injecter_jeton_frontend` ne versionne que les URL `.js` et
    # `.css` d'index.html — vérifié dans `deploy/install.sh` avant d'écrire
    # cette ligne, pas supposé. N'ajoutez pas ici un type que le jeton ne
    # couvre pas : ce serait rendre un correctif invisible pendant une semaine.
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType text/css                 "access plus 7 days"
        ExpiresByType text/javascript          "access plus 7 days"
        ExpiresByType application/javascript   "access plus 7 days"
        # ══ L'INVARIANT, ET POURQUOI image/png N'EST PLUS ICI (Q-43) ═════
        #
        #   > **Un actif ne reçoit un cache long que si son URL est versionnée.**
        #
        # `image/png` portait « access plus 30 days » et ne remplissait pas cette
        # condition : `injecter_jeton_frontend` ne réécrit que les URL `.js` et
        # `.css` (son `sed` ne reconnaît que ces deux extensions). Changer le
        # logo restait donc invisible jusqu'à **trente jours** sur un poste ayant
        # déjà ouvert l'application. La ligne est retirée : les images retombent
        # sur `ExpiresDefault`, une heure, ce qui est la conséquence de
        # l'invariant et non un nombre choisi.
        #
        # ── Pourquoi le jeton n'a PAS été étendu aux images ────────────────
        #
        # C'était le remède évident, et la mesure l'a écarté. Le logo a **deux**
        # URL, pas une : `index.html` en porte une, et `js/core/vault.js:119`
        # en construit une seconde à l'exécution, dans le HTML de la porte de
        # démarrage — le premier écran que voit chaque utilisateur. Mesuré :
        #
        #   /assets/logo/logo-dedienne.png?v=<jeton>  -> max-age=2592000
        #   /assets/logo/logo-dedienne.png            -> max-age=2592000
        #
        # Versionner `index.html` n'aurait donc versionné qu'une des deux, et
        # aurait surtout rendu VERT un garde-fou qui ne regarde que la page.
        # Versionner la seconde supposerait de réécrire du JavaScript dont le
        # jeton est lui-même dérivé du contenu : circulaire, et très cher payé
        # pour un logo. La durée courte est la réponse honnête.
        #
        # ── Ce qui empêche le prochain type de retomber dans le trou ───────
        #
        # `deploy/install.sh` (bloc « banc: configtest ») REFUSE l'installation
        # si un fichier servi avec un `max-age` supérieur à `ExpiresDefault`
        # porte, quelque part dans le frontend publié, une référence de
        # chargement sans `?v=`. Les deux valeurs sortent de ce fichier-ci et du
        # frontend déployé ; aucune n'est recopiée dans un troisième endroit.
        # Ajouter ici `ExpiresByType font/woff2 "access plus 1 year"` sans
        # versionner les polices arrête donc l'installation, en nommant le
        # fichier et la ligne.
        ExpiresDefault                         "access plus 1 hour"
    </IfModule>

    # ---- index.html : JAMAIS mis en cache
    #
    # C'est lui qui porte les jetons des 61 fichiers .js/.css. Un index.html périmé
    # redemande les ANCIENNES URL versionnées, que le cache sert aussitôt : tout le
    # dispositif ci-dessus tombe, et le correctif reste invisible exactement comme
    # avant. Cette règle n'est donc pas un réglage de confort, c'est la condition de
    # validité du bloc précédent.
    #
    # « no-cache » plutôt que « no-store » : la page reste revalidable. Le navigateur
    # redemande, Apache répond 304 tant que rien n'a changé — une requête conditionnelle
    # sur un fichier de quelques kilo-octets, au lieu d'un rechargement complet. Sur un
    # VPN, c'est le bon compromis. « must-revalidate » interdit à un mandataire
    # intermédiaire de servir une copie périmée en cas d'indisponibilité.
    #
    # Le « ExpiresDefault "access plus 1 hour" » ci-dessus s'appliquerait sinon à
    # text/html : une heure suffit déjà à masquer un correctif urgent.
    <FilesMatch "\.html$">
        Header always set Cache-Control "no-cache, must-revalidate"
        ExpiresActive Off
    </FilesMatch>

    # Jamais de cache sur l'API : les données doivent être fraîches, et une
    # réponse d'API mise en cache par un mandataire intermédiaire serait une
    # fuite inter-utilisateurs.
    <LocationMatch "^/api/">
        Header always set Cache-Control "no-store"
        ExpiresActive Off
    </LocationMatch>

    # ================= Journaux =================
    ErrorLog  ${APACHE_LOG_DIR}/cyber-grc-erreurs.log
    CustomLog ${APACHE_LOG_DIR}/cyber-grc-acces.log combined
    LogLevel warn
</VirtualHost>
